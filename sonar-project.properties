# SonarQube 本地扫描配置；运行 scripts/sonar.sh 或 npm run sonar
# sonar.host.url / token 通过环境变量 SONAR_HOST_URL / SONAR_TOKEN 提供（见 scripts/sonar.sh）
sonar.projectKey=github-profile-status
sonar.projectName=github-profile-status
sonar.sourceEncoding=UTF-8
sonar.sources=api
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
